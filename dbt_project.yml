name: 'jaffle_shop'

config-version: 2
version: '0.1'

profile: 'jaffle_shop'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analysis"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
    - "target"
    - "dbt_modules"
    - "logs"

require-dbt-version: [">=1.11.0", "<2.0.0"]

seeds:
  jaffle_shop:
    +docs:
      node_color: '#cd7f32'
    # raw_customers and raw_orders are now auto-detected
    raw_orders:
      +column_types:
        order_total: numeric(10, 2)
        subtotal: numeric(10, 2)
        tax_paid: numeric(10, 2)

models:
  jaffle_shop:
    +materialized: table
    staging:
      +materialized: view
      +docs:
        node_color: 'silver'
    +docs:
      node_color: 'gold'
    marts:
      +materialized: table
