version: 2

models:
  - name: dim_customers
    description: "Customer dimension table with lifetime value"
    columns:
      - name: customer_id
        description: "Unique identifier for a customer"
        tests:
          - unique
          - not_null
      - name: customer_name
        description: "Customer's full name (combined first and last)"
        tests:
          - not_null
      - name: first_order_date
        description: "Date of the customer's first order"
      - name: most_recent_order_date
        description: "Date of the customer's most recent order"
      - name: number_of_orders
        description: "Total number of orders placed by the customer"
      - name: lifetime_value
        description: "Total amount spent by the customer across all orders"
        tests:
          - not_null

  - name: fct_orders
    description: "Order fact table with payment totals"
    columns:
      - name: order_id
        description: "Unique identifier for an order"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to dim_customers"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: amount
        description: "Total order amount (from order_total)"
        tests:
          - not_null

