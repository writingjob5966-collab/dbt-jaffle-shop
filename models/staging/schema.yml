version: 2

models:
  - name: stg_jaffle_shop__customers
    description: "Staged customer data"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: customer_name
        tests:
          - not_null

  - name: stg_jaffle_shop__orders
    description: "Staged order data"
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id
      - name: order_date
        tests:
          - not_null
          
  - name: stg_jaffle_shop__products
    description: "Staged product data"
    columns:
      - name: sku
        data_tests:
          - unique
          - not_null
      - name: type
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - jaffle
                  - beverage